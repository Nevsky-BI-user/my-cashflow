# Monobank б'є вебхук без JWT — вимикаємо перевірку
[functions.mono-webhook]
verify_jwt = false

# Telegram теж б'є без JWT, захист заголовком X-Telegram-Bot-Api-Secret-Token
[functions.telegram-webhook]
verify_jwt = false

[functions.telegram-setup]
verify_jwt = true

# Внутрішня функція: кличуть інші функції з Bearer <SERVICE_ROLE>.
# Service role JWT пройшов би й шлюз, але перевірку робить сам код (токен == SUPABASE_SERVICE_ROLE_KEY)
[functions.categorize]
verify_jwt = false

# Масова категоризація з налаштувань: JWT користувача + whitelist у коді
[functions.categorize-batch]
verify_jwt = true
