function cashEvents(now,lo,hi,cfg,accs,fixed,credits,fees){const t0=pbDate(now),l=pbDate(lo),hh=pbDate(hi),hx=pbAdd(hh,1);const ev=[];

/* каса від сьогодні до горизонту max(3-тя виплата, найпізніше погашення в межах 60 днів), включно: події з балансом після, найнижча точка, каса напередодні дати (before), найнижча від дати (minFrom) */

const crA=acc.filter(function(a){return a.kind==='credit'&&Number(a.debt)>0});const repNm='Погасити борг '+(crA.length===1?crA[0].name:'кредитки');const byD={};const push=function(d,e){const k=pbIso(d);(byD[k]=byD[k]||[]).push(e)};
