    const targetCents = Math.max(minimum, baseAvailableCents);
    const initialGap = safe(BigInt(targetCents) - BigInt(baseAvailableCents), 'initialGap');
    let transferCents = 0;
    let repaymentDate = null;
    if (input.credit !== undefined && input.credit !== null) {
      const credit = input.credit;
      if (typeof credit !== 'object') throw new RangeError('credit must be an object');
      const requested = cents(credit.requestedCents, 'requestedCents');
      const eligible = credit.eligibleCents == null ? null : cents(credit.eligibleCents, 'eligibleCents');
      const limit = credit.limitCents == null ? null : cents(credit.limitCents, 'limitCents');
      if (credit.repaymentDate != null) {
        if (date(credit.repaymentDate, 'repaymentDate') < startTime) throw new RangeError('repaymentDate must be on or after start');
        repaymentDate = credit.repaymentDate;
      }
      if (eligible !== null && limit !== null && repaymentDate !== null) transferCents = Math.min(requested, eligible, limit, initialGap);
    }
    const availableCents = safe(BigInt(baseAvailableCents) + BigInt(transferCents), 'availableCents');
    const gapCents = safe(BigInt(Math.max(0, minimum)) - BigInt(Math.min(minimum, availableCents)), 'gapCents');
    const totals = allocate(targetCents, units, categories);
    const remaining = totals.slice();
    let cash = availableCents;
    let debtAtEndCents = transferCents;
    const quotient = Math.floor(targetCents / days);
    const extra = targetCents % days;
    const schedule = Array.from({ length: days }, (_, day) => {
      const dayDate = new Date(startTime + day * DAY).toISOString().slice(0, 10);
      const spendCents = quotient + (day < extra ? 1 : 0);
      const amounts = day === days - 1 ? remaining.slice() : allocate(spendCents, remaining.map(BigInt), categories);
      amounts.forEach((amount, index) => { remaining[index] -= amount; });
      const repaymentCents = dayDate === repaymentDate ? transferCents : 0;
      debtAtEndCents -= repaymentCents;
      cash = safe(BigInt(cash) - BigInt(spendCents) - BigInt(repaymentCents), 'remainingCents');
      return { date: dayDate, spendCents, repaymentCents, remainingCents: cash,
        byCategory: categories.map((category, index) => ({ id: category.id, name: category.name, amountCents: amounts[index] })) };
    });
    return { days, start: input.start, end: input.end, baseAvailableCents, availableCents, targetCents,
      gapCents, transferCents, newDebtCents: transferCents, debtAtEndCents, repaymentDate,
      averageDailyCents: targetCents / days, endingCents: cash,
      categories: categories.map((category, index) => ({ ...category, totalCents: totals[index] })), schedule };
  }

  return { planPeriod };
});

function openDialog(title,body){restoreFocus=appRoot.activeElement;const d=appRoot.getElementById('dialog');d.innerHTML=`<div class="cardhead"><h2 id="dialog-title">${title}</h2><button class="iconbtn" data-action="close" aria-label="Закрити діалог">${icon('close',18)}</button></div>${body}`;d.showModal()}
appRoot.getElementById('dialog').addEventListener('close',()=>{if(restoreFocus&&restoreFocus.isConnected)restoreFocus.focus()});
function showFormula(){const p=plan();openDialog('Звідки ця сума',`<p>План на 21 жовтня — 5 листопада. Наступна виплата — 6 листопада.</p><div class="row"><span>Власні кошти</span><b>${money(ownCents)}</b></div><div class="row"><span>Очікувана виплата</span><b class="positive">+${money(example==='rich'?6800000:example==='negative'?3900000:5000000)}</b></div><div class="row"><span>Обовʼязкові платежі</span><b>−${money(2800000)}</b></div><div class="row"><span>Погашення боргу</span><b>−${money(1600000)}</b></div><div class="row"><b>Доступно після виплати</b><b>${money(p.baseAvailableCents)}</b></div>${credit?`<div class="row"><span>Кредитний сценарій</span><b>+${money(p.transferCents)}</b></div>`:''}<div class="inset space"><div class="row"><span>План на ${p.days} днів</span><b>${money(p.targetCents)}</b></div><div class="row"><span>Непокрита частина</span><b class="risk">${money(p.gapCents)}</b></div></div><p class="space">Залишок на картках може відрізнятися: тут кошти на платежі вже зарезервовано.</p>`)}
function showCredit(){const p=plan();openDialog('Сценарій із кредитом',`<p>Перевірте, як змінився б план за використання кредитних коштів. Жодних переказів не буде.</p><div class="row"><span>До щоденного бюджету</span><b>+${money(Math.min(620000,p.gapCents+p.transferCents))}</b></div><div class="row"><span>Новий борг</span><b>${money(Math.min(620000,p.gapCents+p.transferCents))}</b></div><div class="row"><span>Дата погашення</span><b>6 листопада</b></div><div class="notice space"><strong>Кредит потрібно повернути</strong>Новий борг не входить у поточний резерв 16 000 ₴. Його слід врахувати в наступному періоді.</div><div class="dialogfooter"><button class="cf-btn secondary" data-action="credit-off">Без кредиту</button><button class="cf-btn" data-action="credit-on">Показати сценарій</button></div>`)}
function showEdit(){openDialog('Частки щоденного бюджету',`<p>Розподіліть 100% між категоріями. Сума бюджету не зміниться.</p><form id="weights-form">${categories.map(c=>`<div class="edit-row"><label for="weight-${c.id}">${c.name}</label><input id="weight-${c.id}" name="${c.id}" type="number" min="1" max="100" step="1" required value="${c.weight}" aria-label="${c.name}, частка у відсотках"><span>%</span></div>`).join('')}<div class="error" id="weights-error" role="alert"></div><button class="cf-btn wide" type="submit">Застосувати частки</button></form>`)}
function showGoal(i){const g=goals[i];openDialog('Внесок: '+g.name,`<p>Демонстраційний внесок із власних коштів. Зараз доступно ${money(ownCents)}. Сума зменшить власний залишок і збільшить заощадження.</p><form id="goal-form" data-index="${i}"><div class="edit-row"><label for="contribution">Сума, ₴</label><input id="contribution" type="number" min="0.01" max="${Math.min(ownCents,g.target-g.current)/100}" step="0.01" required placeholder="500"></div><div id="goal-error" class="error" role="alert"></div><button class="cf-btn wide" type="submit">Додати демовнесок</button></form>`)}
function toast(text){appRoot.getElementById('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>appRoot.getElementById('toast').textContent='',3500)}
appRoot.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();void 0;return}if(b.id==='theme'){host.dataset.theme=host.dataset.theme==='light'?'dark':'light';updateThemeButton();return}if(b.dataset.payment){paymentTab=b.dataset.payment;render();return}if(b.dataset.goal!==undefined){showGoal(Number(b.dataset.goal));return}const a=b.dataset.action;if(a==='formula')showFormula();if(a==='credit')showCredit();if(a==='edit')showEdit();if(a==='close')appRoot.getElementById('dialog').close();if(a==='credit-on'||a==='credit-off'){credit=a==='credit-on';appRoot.getElementById('dialog').close();render();appRoot.querySelector('[data-action=credit]')?.focus();toast(credit?'Сценарій увімкнено. Реальних переказів немає.':'Повернули план без кредиту.')}});
appRoot.addEventListener('change',event=>{if(event.target.id==='example'){example=event.target.value;credit=false;render()}if(event.target.id==='op-filter'){opFilter=event.target.value;appRoot.getElementById('operation-rows').innerHTML=operationRows()}});
appRoot.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;appRoot.getElementById('operation-rows').innerHTML=operationRows()}if(event.target.closest('#weights-form')){const total=[...appRoot.querySelectorAll('#weights-form input')].reduce((s,x)=>s+Number(x.value),0);appRoot.getElementById('weights-error').textContent=total===100?'':`Разом ${total}%. Потрібно 100%.`}});
appRoot.addEventListener('submit',event=>{if(event.target.id==='weights-form'){event.preventDefault();const next=categories.map(c=>({...c,weight:Number(appRoot.getElementById('weight-'+c.id).value)}));if(next.some(c=>!Number.isInteger(c.weight)||c.weight<=0)||next.reduce((s,c)=>s+c.weight,0)!==100){appRoot.getElementById('weights-error').textContent='Частки мають бути додатними цілими числами й разом складати 100%.';return}categories=next;appRoot.getElementById('dialog').close();render();appRoot.querySelector('[data-action=edit]')?.focus();toast('Частки застосовано до демонстраційного плану.')}if(event.target.id==='goal-form'){event.preventDefault();const g=goals[Number(event.target.dataset.index)],amount=Math.round(Number(appRoot.getElementById('contribution').value)*100);if(!Number.isFinite(amount)||amount<=0||amount>Math.min(ownCents,g.target-g.current)){appRoot.getElementById('goal-error').textContent='Укажіть додатну суму в межах власних коштів і залишку до цілі.';return}g.current+=amount;ownCents-=amount;appRoot.getElementById('dialog').close();render();appRoot.querySelector('[data-goal=\"'+event.target.dataset.index+'\"]')?.focus();toast('Демонстраційний внесок додано.')}});
render();

    return render;
  }
  const refreshers=[];
  for (const id of ['cashflow-minimal-desktop', 'cashflow-minimal-phone']) {
    const host = root.querySelector('#' + id);
    const appRoot = host.attachShadow({mode:'open'});
    appRoot.append(template.content.cloneNode(true));
    const bodyRoot=appRoot.querySelector('.cf-preview-body');
    bodyRoot.append(appRoot.querySelector('.sidebar'));
    refreshers.push(initialize(appRoot, host, bodyRoot));
    if(globalThis.Tweak){
      const state={radius:24};
      const tweak=new Tweak({container:host,onChange:()=>host.style.setProperty('--cf-preview-radius',state.radius+'px')});
      tweak.addSlider(state,'radius',{label:'Заокруглення поверхонь',min:16,max:30,unit:'px'});
    }
  }
  // Runtime може вставити піктограми після першого виконання фрагмента.
  const iconObserver=new MutationObserver(()=>{
    if(iconBank.querySelectorAll('svg').length===Object.keys(names).length){
      iconObserver.disconnect();refreshers.forEach(refresh=>refresh());
    }
  });
  if(iconBank.querySelectorAll('svg').length<Object.keys(names).length)
    iconObserver.observe(iconBank,{childList:true,subtree:true});
})();
</script>
