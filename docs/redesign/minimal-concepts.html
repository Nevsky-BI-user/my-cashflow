const row=(t)=>`<div class="row"><div class="row-left"><div class="tile">${icon(t.icon,18)}</div><div><b>${t.name}</b><small>${t.category} · ${t.date}</small></div></div><span class="money ${t.amount>0?'positive':''}">${t.amount>0?'+':''}${money(t.amount)}</span></div>`;
function paymentRows(items){return items.map(p=>`<div class="row paymentrow"><div class="row-left"><div class="datebox"><b>${p.day}</b>${p.month}</div><div><b>${p.name}</b><small>${p.detail}</small></div></div><span class="money">${money(p.amount)}</span></div>`).join('')}
function exampleSelect(){return `<label class="demo-label">Приклад<select class="demo-select" id="example"><option value="normal" ${example==='normal'?'selected':''}>Базовий</option><option value="rich" ${example==='rich'?'selected':''}>Вищий дохід</option><option value="negative" ${example==='negative'?'selected':''}>Нестача коштів</option></select></label>`}
function hero(p){return `<section class="card hero"><div class="hero-top"><span class="eyebrow">Доступно після виплати</span><button class="iconbtn" data-action="formula" aria-label="Як розраховано доступну суму">${icon('info',17)}</button></div><div class="amount ${p.availableCents<0?'negative':''}" id="hero-value">${money(p.availableCents).replace(' ₴','')} <span>₴</span></div><p class="hero-period">21 жовтня — 5 листопада</p><p class="hero-description">Після резерву на обовʼязкові платежі та погашення боргу.</p>${p.gapCents>0?`<p class="hero-risk">До бюджету <b>${money(p.targetCents)}</b> бракує <b>${money(p.gapCents)}</b></p>`:''}<div class="hero-bottom"><div class="metric"><small>План на день</small><strong>${money(p.averageDailyCents,true)}</strong></div><div class="metric"><small><span class="dot"></span>До наступної виплати</small><strong>${p.days} днів</strong></div></div></section>`}
function chartCard(p){return `<section class="card forecast"><div class="cardhead"><h2>До наступної виплати</h2>${exampleSelect()}</div><p class="chart-caption">Залишок на щоденні витрати. Після резервування коштів на обовʼязкові платежі й погашення боргу.</p><div id="chart-holder"></div><div class="legend"><span><i style="background:var(--ink)"></i>Залишок</span>${categories.map((c,i)=>`<span><i style="background:${colors[i]}"></i>${c.name}</span>`).join('')}</div><div class="chartread inset"><div><small>Залишок наприкінці дня</small><strong id="day-remaining"></strong></div><label>Обрати день<select id="day-select">${p.schedule.map((d,i)=>`<option value="${i}" ${i===selectedDay?'selected':''}>${dateLabel(d.date)}</option>`).join('')}</select></label></div><div class="readcats" id="day-categories"></div><div class="space ${p.endingCents<0?'notice':'inset'}"><strong>${p.endingCents<0?'До 6 листопада бракуватиме '+money(-p.endingCents):'План повністю покрито'}</strong>${p.endingCents<0?' План щоденних витрат — '+money(p.targetCents)+' на весь період.':' Витрати розподілено до наступної виплати.'}</div></section>`}
function overview(p){return head('Гроші під контролем','Один погляд на спільний план.')+`<div class="grid"><div class="maincol">${hero(p)}${chartCard(p)}<section class="card recent"><div class="cardhead"><h2>Останні операції</h2><button class="textbtn" data-page="operations">Усі ${icon('arrow',13)}</button></div>${transactions.slice(0,3).map(row).join('')}</section></div><div class="sidecol"><section class="card upcoming"><div class="cardhead"><h2>Найближчі платежі</h2><button class="textbtn" data-page="payments" aria-label="Усі платежі">${icon('arrow',16)}</button></div>${paymentRows(payments.slice(0,3))}<p class="footnote">${icon('shield',13)}44 000 ₴ уже враховано в резерві</p></section><section class="card reserve"><div class="cardhead"><h2>Баланс періоду</h2>${icon('budget',18)}</div><div class="row"><span class="muted">Власні кошти</span><b>${money(ownCents)}</b></div><div class="row"><span class="muted">Очікувана виплата</span><b class="positive">+${money(example==='rich'?6800000:example==='negative'?3900000:5000000)}</b></div><div class="row"><span class="muted">Обовʼязкові витрати</span><b>−${money(2800000)}</b></div><div class="row"><span class="muted">Погашення боргу</span><b>−${money(1600000)}</b></div><button class="textbtn space" data-action="credit">${credit?'Переглянути сценарій із кредитом':'Розглянути кредитний сценарій'} ${icon('arrow',13)}</button></section><section class="card overview-goal"><div class="cardhead"><h2>Фінансова подушка</h2>${icon('shield',20)}</div><p class="muted" style="font-size:12px">Резерв для впевненості в завтрашньому дні.</p><div class="goal-detail"><b>${money(goals[0].current)}</b><span class="muted">${Math.round(goals[0].current/goals[0].target*100)}%</span></div><div class="progress"><span style="width:${Math.min(100,goals[0].current/goals[0].target*100)}%"></span></div><button class="textbtn space" data-page="savings">До заощаджень ${icon('arrow',13)}</button></section></div></div>`}
function budget(p){return head('Бюджет без зайвого','Кожній гривні — своє місце.')+`<div class="grid"><div class="maincol"><section class="card"><div class="cardhead"><h2>Щоденні витрати</h2><button class="textbtn" data-action="edit">Змінити частки ${icon('arrow',13)}</button></div><div class="summary-pair"><div class="inset"><small>На весь період</small><strong>${money(p.targetCents)}</strong><small>21 жовтня — 5 листопада</small></div><div class="inset"><small>У середньому на день</small><strong>${money(p.averageDailyCents,true)}</strong><small>${p.days} днів у плані</small></div></div><div class="allocation">${p.categories.map((c,i)=>`<span style="width:${c.weight}%;background:${colors[i]}"></span>`).join('')}</div><div class="categories">${p.categories.map((c,i)=>`<div class="category"><span class="category-name"><i style="background:${colors[i]}"></i>${c.name}</span><span class="pct">${c.weight}%</span><b class="money">${money(c.totalCents)}</b></div>`).join('')}</div></section>${chartCard(p)}</div><div class="sidecol"><section class="card"><div class="cardhead"><h2>Як працює план</h2>${icon('info',18)}</div><div class="stack"><p class="muted">Спочатку відкладаємо кошти на обовʼязкові платежі й борг.</p><p class="muted">Решту ділимо між категоріями. Мінімальний план на життя — 15 000 ₴.</p><div class="notice"><strong>${p.gapCents>0?'Непокрита частина: '+money(p.gapCents):'Дохід покриває план'}</strong>${p.gapCents>0?'Розподіл показує потребу, а не додаткові гроші на рахунку.':'Увесь доступний залишок розподілено на щоденні витрати.'}</div><button class="btn secondary" data-action="formula">Переглянути розрахунок</button></div></section></div></div>`}
function operationRows(){const items=transactions.filter(t=>(opFilter==='all'||(opFilter==='income'?t.amount>0:t.amount<0))&&(t.name+' '+t.category).toLocaleLowerCase('uk').includes(query.toLocaleLowerCase('uk')));return items.length?items.map(row).join(''):'<p class="empty">За цим запитом операцій немає.</p>'}
function operations(){return head('Історія в деталях','Усі рухи коштів в одному місці.')+`<section class="card"><div class="cardhead"><h2>Операції</h2><span class="badge">Демонстраційна історія</span></div><div class="searchbar"><input id="search" type="search" placeholder="Знайти операцію" aria-label="Пошук операцій" value=""><select id="op-filter" aria-label="Тип операцій"><option value="all">Усі</option><option value="expense">Витрати</option><option value="income">Доходи</option></select></div><div id="operation-rows">${operationRows()}</div></section>`}
function paymentsPage(){return head('Нічого не пропустити','Важливі дати й зобовʼязання.')+`<div class="grid"><section class="card"><div class="cardhead"><h2>Платежі</h2>${icon('payments',20)}</div><div class="tabs" aria-label="Статус платежів"><button data-payment="planned" class="${paymentTab==='planned'?'active':''}" aria-pressed="${paymentTab==='planned'}">Заплановані</button><button data-payment="paid" class="${paymentTab==='paid'?'active':''}" aria-pressed="${paymentTab==='paid'}">Сплачені</button></div>${paymentRows(payments.filter(p=>p.status===paymentTab))}${credit&&paymentTab==='planned'?paymentRows([{day:'06',month:'лис',name:'Новий кредитний борг',detail:'Окремо від поточного резерву',amount:plan().newDebtCents}]):''}</section><section class="card"><div class="cardhead"><h2>Резерв на платежі</h2>${icon('shield',20)}</div><div class="goal-amount">44 000 ₴</div><p class="muted">28 000 ₴ на зобовʼязання та 16 000 ₴ на погашення поточного боргу.</p><div class="inset space"><small>Наступна виплата</small><h3 style="margin-top:4px">6 листопада</h3></div><p class="footnote">Ескіз показує графік. Гроші не списуються.</p></section></div>`}
function savings(){return head('На те, що важливо','Невеликі кроки до спільних цілей.')+`<div class="goals-grid">${goals.map((g,i)=>`<section class="card"><div class="goal-icon">${icon(g.icon,27)}</div><h2>${g.name}</h2><p class="muted" style="margin-top:6px">${g.description}</p><div class="goal-amount">${money(g.current)}</div><small>із ${money(g.target)}</small><div class="goal-detail"><span class="muted">Накопичено</span><b>${Math.round(g.current/g.target*100)}%</b></div><div class="progress"><span style="width:${Math.min(100,g.current/g.target*100)}%"></span></div><button class="btn secondary wide space" data-goal="${i}">${icon('plus',17)}Додати внесок</button></section>`).join('')}</div><p class="footnote">${icon('info',14)}Демонстраційні внески діють до перезавантаження сторінки.</p>`}
function render(){const p=plan();selectedDay=Math.min(selectedDay,p.days-1);document.querySelector('.nav').innerHTML=pages.map(([id,label])=>`<button data-page="${id}" aria-label="${label}" ${page===id?'aria-current="page"':''}>${icon(id)}<span>${label}</span></button>`).join('');document.getElementById('breadcrumb').textContent=pages.find(x=>x[0]===page)[1];document.getElementById('content').innerHTML=`<div class="view">${page==='overview'?overview(p):page==='budget'?budget(p):page==='operations'?operations():page==='payments'?paymentsPage():savings()}<footer class="footnote">Ескіз · вигадані дані · жовтень 2026</footer></div>`;if(chartObserver)chartObserver.disconnect();if(document.getElementById('chart-holder'))drawChart(p);if(page==='operations'){document.getElementById('search').value=query;document.getElementById('op-filter').value=opFilter}updateThemeButton()}
let chartObserver;
function drawChart(p){
const holder=document.getElementById('chart-holder');if(!holder)return;
const w=Math.max(230,Math.round(holder.getBoundingClientRect().width)),h=304,left=44,right=10,top=18,lineH=135,barTop=218,barH=57,plotW=w-left-right;
const max=Math.max(p.availableCents,0),min=Math.min(p.endingCents,0),range=max-min||1,y=v=>top+(max-v)/range*lineH,x=i=>left+i/p.days*plotW;
let body='';
for(const v of [...new Set([max,0,min])])body+=`<line class="gridline" x1="${left}" x2="${w-right}" y1="${y(v)}" y2="${y(v)}"/><text x="${left-6}" y="${y(v)+4}" text-anchor="end">${new Intl.NumberFormat('uk-UA',{maximumFractionDigits:1}).format(v/100000)} тис.</text>`;
const path=`M${x(0)},${y(p.availableCents)} `+p.schedule.map((d,i)=>`L${x(i+1)},${y(d.remainingCents)}`).join(' ');
body+=`<path class="balance" d="${path}"/><text x="${left}" y="${top+lineH+23}">21 жов.</text><text x="${x(8)}" y="${top+lineH+23}" text-anchor="middle">29 жов.</text><text x="${w-right}" y="${top+lineH+23}" text-anchor="end">6 лис.</text><text x="0" y="${barTop-17}">Щоденні витрати · ${money(p.averageDailyCents,true)} / день</text>`;
const dailyMax=Math.max(...p.schedule.map(d=>d.spendCents),1);
body+=`<text x="${left-6}" y="${barTop+4}" text-anchor="end">${Math.round(dailyMax/100)}</text><text x="${left-6}" y="${barTop+barH+4}" text-anchor="end">0 ₴</text><line class="gridline" x1="${left}" x2="${w-right}" y1="${barTop+barH}" y2="${barTop+barH}"/>`;
p.schedule.forEach((d,i)=>{let cum=0;d.byCategory.forEach((c,j)=>{const bh=c.amountCents/dailyMax*barH;body+=`<rect x="${x(i)+2}" y="${barTop+barH-cum-bh}" width="${Math.max(2,plotW/p.days-4)}" height="${bh}" fill="${colors[j]}"/>`;cum+=bh})});
body+=`<line id="chart-cursor" x1="${x(selectedDay+1)}" x2="${x(selectedDay+1)}" y1="${top}" y2="${top+lineH}" stroke="var(--muted)" stroke-dasharray="3 4"/><circle id="chart-point" cx="${x(selectedDay+1)}" cy="${y(p.schedule[selectedDay].remainingCents)}" r="4" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>`;
holder.innerHTML=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Прогноз залишку та щоденні витрати на окремих шкалах у гривнях">${body}</svg>`;
const svg=holder.querySelector('.chart');svg.addEventListener('pointerdown',event=>{const r=svg.getBoundingClientRect();selectDay(Math.max(0,Math.min(p.days-1,Math.round(((event.clientX-r.left)/r.width*w-left)/plotW*p.days)-1)))});
function selectDay(i){selectedDay=i;document.getElementById('day-select').value=i;updateDay(p);document.getElementById('chart-cursor').setAttribute('x1',x(i+1));document.getElementById('chart-cursor').setAttribute('x2',x(i+1));document.getElementById('chart-point').setAttribute('cx',x(i+1));document.getElementById('chart-point').setAttribute('cy',y(p.schedule[i].remainingCents))}
document.getElementById('day-select').onchange=e=>selectDay(Number(e.target.value));updateDay(p);
if(chartObserver)chartObserver.disconnect();chartObserver=new ResizeObserver(entries=>{if(Math.round(entries[0].contentRect.width)!==w)drawChart(plan())});chartObserver.observe(holder);
}
function updateDay(p){const d=p.schedule[selectedDay];document.getElementById('day-remaining').textContent=money(d.remainingCents,true);document.getElementById('day-remaining').className=d.remainingCents<0?'negative':'';document.getElementById('day-categories').innerHTML=`<span><b>За день ${money(d.spendCents,true)}</b></span>`+d.byCategory.map(c=>`<span>${c.name} ${money(c.amountCents,true)}</span>`).join('')}
function updateThemeButton(){const dark=document.documentElement.dataset.theme==='dark';document.getElementById('theme').innerHTML=icon(dark?'sun':'moon',18);document.getElementById('theme').setAttribute('aria-label',dark?'Увімкнути світлу тему':'Увімкнути темну тему')}
let restoreFocus;
function openDialog(title,body){restoreFocus=document.activeElement;const d=document.getElementById('dialog');d.innerHTML=`<div class="cardhead"><h2 id="dialog-title">${title}</h2><button class="iconbtn" data-action="close" aria-label="Закрити діалог">${icon('close',18)}</button></div>${body}`;d.showModal()}
document.getElementById('dialog').addEventListener('close',()=>{if(restoreFocus&&restoreFocus.isConnected)restoreFocus.focus()});
function showFormula(){const p=plan();openDialog('Звідки ця сума',`<p>План на 21 жовтня — 5 листопада. Наступна виплата — 6 листопада.</p><div class="row"><span>Власні кошти</span><b>${money(ownCents)}</b></div><div class="row"><span>Очікувана виплата</span><b class="positive">+${money(example==='rich'?6800000:example==='negative'?3900000:5000000)}</b></div><div class="row"><span>Обовʼязкові платежі</span><b>−${money(2800000)}</b></div><div class="row"><span>Погашення боргу</span><b>−${money(1600000)}</b></div><div class="row"><b>Доступно після виплати</b><b>${money(p.baseAvailableCents)}</b></div>${credit?`<div class="row"><span>Кредитний сценарій</span><b>+${money(p.transferCents)}</b></div>`:''}<div class="inset space"><div class="row"><span>План на ${p.days} днів</span><b>${money(p.targetCents)}</b></div><div class="row"><span>Непокрита частина</span><b class="risk">${money(p.gapCents)}</b></div></div><p class="space">Залишок на картках може відрізнятися: тут кошти на платежі вже зарезервовано.</p>`)}
function showCredit(){const p=plan();openDialog('Сценарій із кредитом',`<p>Перевірте, як змінився б план за використання кредитних коштів. Жодних переказів не буде.</p><div class="row"><span>До щоденного бюджету</span><b>+${money(Math.min(620000,p.gapCents+p.transferCents))}</b></div><div class="row"><span>Новий борг</span><b>${money(Math.min(620000,p.gapCents+p.transferCents))}</b></div><div class="row"><span>Дата погашення</span><b>6 листопада</b></div><div class="notice space"><strong>Кредит потрібно повернути</strong>Новий борг не входить у поточний резерв 16 000 ₴. Його слід врахувати в наступному періоді.</div><div class="dialogfooter"><button class="btn secondary" data-action="credit-off">Без кредиту</button><button class="btn" data-action="credit-on">Показати сценарій</button></div>`)}
function showEdit(){openDialog('Частки щоденного бюджету',`<p>Розподіліть 100% між категоріями. Сума бюджету не зміниться.</p><form id="weights-form">${categories.map(c=>`<div class="edit-row"><label for="weight-${c.id}">${c.name}</label><input id="weight-${c.id}" name="${c.id}" type="number" min="1" max="100" step="1" required value="${c.weight}" aria-label="${c.name}, частка у відсотках"><span>%</span></div>`).join('')}<div class="error" id="weights-error" role="alert"></div><button class="btn wide" type="submit">Застосувати частки</button></form>`)}
function showGoal(i){const g=goals[i];openDialog('Внесок: '+g.name,`<p>Демонстраційний внесок із власних коштів. Зараз доступно ${money(ownCents)}. Сума зменшить власний залишок і збільшить заощадження.</p><form id="goal-form" data-index="${i}"><div class="edit-row"><label for="contribution">Сума, ₴</label><input id="contribution" type="number" min="0.01" max="${Math.min(ownCents,g.target-g.current)/100}" step="0.01" required placeholder="500"></div><div id="goal-error" class="error" role="alert"></div><button class="btn wide" type="submit">Додати демовнесок</button></form>`)}
function toast(text){document.getElementById('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',3500)}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0);return}if(b.id==='theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';updateThemeButton();return}if(b.dataset.payment){paymentTab=b.dataset.payment;render();return}if(b.dataset.goal!==undefined){showGoal(Number(b.dataset.goal));return}const a=b.dataset.action;if(a==='formula')showFormula();if(a==='credit')showCredit();if(a==='edit')showEdit();if(a==='close')document.getElementById('dialog').close();if(a==='credit-on'||a==='credit-off'){credit=a==='credit-on';document.getElementById('dialog').close();render();document.querySelector('[data-action=credit]')?.focus();toast(credit?'Сценарій увімкнено. Реальних переказів немає.':'Повернули план без кредиту.')}});
document.addEventListener('change',event=>{if(event.target.id==='example'){example=event.target.value;credit=false;render()}if(event.target.id==='op-filter'){opFilter=event.target.value;document.getElementById('operation-rows').innerHTML=operationRows()}});
document.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;document.getElementById('operation-rows').innerHTML=operationRows()}if(event.target.closest('#weights-form')){const total=[...document.querySelectorAll('#weights-form input')].reduce((s,x)=>s+Number(x.value),0);document.getElementById('weights-error').textContent=total===100?'':`Разом ${total}%. Потрібно 100%.`}});
document.addEventListener('submit',event=>{if(event.target.id==='weights-form'){event.preventDefault();const next=categories.map(c=>({...c,weight:Number(document.getElementById('weight-'+c.id).value)}));if(next.some(c=>!Number.isInteger(c.weight)||c.weight<=0)||next.reduce((s,c)=>s+c.weight,0)!==100){document.getElementById('weights-error').textContent='Частки мають бути додатними цілими числами й разом складати 100%.';return}categories=next;document.getElementById('dialog').close();render();document.querySelector('[data-action=edit]')?.focus();toast('Частки застосовано до демонстраційного плану.')}if(event.target.id==='goal-form'){event.preventDefault();const g=goals[Number(event.target.dataset.index)],amount=Math.round(Number(document.getElementById('contribution').value)*100);if(!Number.isFinite(amount)||amount<=0||amount>Math.min(ownCents,g.target-g.current)){document.getElementById('goal-error').textContent='Укажіть додатну суму в межах власних коштів і залишку до цілі.';return}g.current+=amount;ownCents-=amount;document.getElementById('dialog').close();render();document.querySelector('[data-goal=\"'+event.target.dataset.index+'\"]')?.focus();toast('Демонстраційний внесок додано.')}});
render();
</script></body></html>
