<dialog id="explanation" aria-labelledby="explanation-title"><div class="row between"><h2 id="explanation-title">Як пораховано</h2><button class="icon-button" data-close aria-label="Закрити пояснення"><svg class="icon"><use href="#i-close"/></svg></button></div><p>Прогноз після виплати · 21 жовтня — 6 листопада. Період між двома виплатами; всі суми вигадані.</p><div><div class="formula-row"><span>Власні кошти зараз</span><strong class="num money" data-value="ownCurrency">2 800 ₴</strong></div><div class="formula-row"><span>Наступна виплата</span><strong class="num money">+50 000 ₴</strong></div><div class="formula-row"><span>Обовʼязкові платежі</span><strong class="num money">−28 000 ₴</strong></div><div class="formula-row"><span>Увесь кредитний борг</span><strong class="num money">−16 000 ₴</strong></div><div class="formula-row"><span>Доступно після виплати</span><strong class="num money" data-value="availableCurrency">8 800 ₴</strong></div></div><p>Заощадження зберігаються окремо й не входять у власні кошти цього розрахунку. Кредитний ліміт не додається. Бажаний мінімум — 15 000 ₴ на щоденні витрати протягом періоду, але прогноз не підвищується до нього автоматично.</p><button class="primary" data-close>Зрозуміло</button></dialog>
<dialog id="credit-option" aria-labelledby="credit-title"><div class="row between"><h2 id="credit-title">Варіант із кредиткою</h2><button class="icon-button" data-close aria-label="Закрити варіант"><svg class="icon"><use href="#i-close"/></svg></button></div><p>Ілюстрація: частину обовʼязкових платежів на <strong class="money" data-value="gap">6 200 ₴</strong> можна було б оплатити кредиткою, якщо ці платежі допускають таку оплату.</p><div class="formula-row"><span>Зберегти власних коштів</span><strong class="money">15 000 ₴</strong></div><div class="formula-row"><span>Новий борг</span><strong class="money" data-value="gap">6 200 ₴</strong></div><div class="formula-row"><span>Умовне погашення</span><strong>24 листопада</strong></div><p>Перевірте доступний ліміт, комісії, пільговий період і реальну дату погашення. Цей варіант переносить навантаження на наступний період. Він не гарантує безвідсоткової оплати.</p><p>Це порівняння, а не автоматична дія. Основний прогноз залишається <strong class="money" data-value="availableCurrency">8 800 ₴</strong>.</p><button class="primary" data-close>Повернутися до прогнозу</button></dialog>
<dialog id="contribution" aria-labelledby="contribution-title"><form id="contribution-form"><div class="row between"><h2 id="contribution-title">На крок ближче</h2><button type="button" class="icon-button" data-close aria-label="Закрити внесок"><svg class="icon"><use href="#i-close"/></svg></button></div><p>Окреме переміщення з поточних власних коштів у заощадження. Воно зменшить власні кошти й прогноз після виплати. Змінюються лише вигадані суми.</p><label for="goal-select">На що відкладаємо</label><select id="goal-select"><option value="0">Резерв на непередбачене</option><option value="1">Спільна подорож</option><option value="2">Нова техніка</option></select><label for="contribution-amount">Сума, ₴</label><input id="contribution-amount" type="number" min="1" max="2800" step="1" value="1000" required inputmode="numeric"><p>Власні кошти зараз: <strong class="num money" data-value="ownCurrency">2 800 ₴</strong></p><button type="submit" class="primary">Відкласти в ескізі<svg class="icon"><use href="#i-arrow"/></svg></button></form></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</template>
<script>
(() => {
const proposal = document.getElementById('cashflow-inline-proposal');
const template = document.getElementById('cashflow-product-template');
function initialize(appRoot, host) {

'use strict';
const $=(s,root=appRoot)=>root.querySelector(s),$$=(s,root=appRoot)=>[...root.querySelectorAll(s)];
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const money=n=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:0}).format(n);
const routes=[['overview','Огляд','home'],['plan','Бюджет','plan'],['operations','Операції','flow'],['payments','Платежі','plan'],['savings','Заощадження','goal']];
const titles={overview:'Гроші під контролем.',plan:'Бюджет, що дає спокій.',payments:'Усе важливе — вчасно.',operations:'Куди йдуть гроші.',savings:'На ваше майбутнє.'};
const goals=[{name:'Резерв на непередбачене',short:'Фінансовий резерв',amount:9000,target:60000,icon:'shield',note:'Подушка спокою для вашої сімʼї'},{name:'Спільна подорож',short:'Спільна подорож',amount:6000,target:30000,icon:'sun',note:'Нові місця. Спільні спогади.'},{name:'Нова техніка',short:'Нова техніка',amount:3000,target:25000,icon:'device',note:'Оновлення без кредиту'}];
const transactions=[{name:'Продуктова крамниця',category:'Продукти',date:'10 жовтня',amount:-845,icon:'bag'},{name:'Міський транспорт',category:'Транспорт',date:'10 жовтня',amount:-80,icon:'flow'},{name:'Кавʼярня біля дому',category:'Кафе',date:'9 жовтня',amount:-160,icon:'sun'},{name:'Книжкова полиця',category:'Дозвілля',date:'8 жовтня',amount:-420,icon:'bag'},{name:'Зарплата',category:'Дохід',date:'7 жовтня',amount:30000,icon:'wallet'},{name:'Інтернет',category:'Звʼязок',date:'6 жовтня',amount:-300,icon:'flow'}];
let ownFunds=2800;
let activePage='overview',privateAmounts=false,toastTimer,lastFocus=null;
function saved(){return goals.reduce((sum,goal)=>sum+goal.amount,0)}
function available(){return ownFunds+50000-28000-16000}
function showToast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4200)}
function setTheme(theme){host.dataset.theme=theme;$('.theme-switch').dataset.active=theme;$$('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===theme)));try{localStorage.setItem('cashflow-sketch-theme',theme)}catch{}}
function navigate(page){if(!routes.some(r=>r[0]===page))return;activePage=page;$$('.page').forEach(el=>el.hidden=el.id!==page);$('#page-title').textContent=titles[page];$$('nav [data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});}
function renderTransactions(){const query=$('#search').value.trim().toLocaleLowerCase('uk');const found=transactions.filter(t=>(t.name+' '+t.category+' '+t.date).toLocaleLowerCase('uk').includes(query));const render=t=>`<div class="transaction"><span class="category-icon">${icon(t.icon)}</span><div class="description"><h3>${t.name}</h3><p>${t.category} · ${t.date}</p></div><strong class="num money ${t.amount>0?'positive':''}">${t.amount>0?'+':'−'}${money(Math.abs(t.amount))} ₴</strong></div>`;$('#recent').innerHTML=transactions.slice(0,3).map(render).join('');$('#ledger').innerHTML=found.map(render).join('');$('#empty').hidden=found.length>0;$('#result-count').textContent=`Показано: ${found.length} із ${transactions.length}`}
function renderMoney(){const values={own:money(ownFunds),ownCurrency:money(ownFunds)+' ₴',available:money(available()),saved:money(saved()),availableCurrency:money(available())+' ₴',savedCurrency:money(saved())+' ₴',gap:money(Math.max(0,15000-available()))+' ₴',negativeGap:'−'+money(Math.max(0,15000-available()))+' ₴',daily:'937,50 ₴'};$$('[data-value]').forEach(el=>el.textContent=values[el.dataset.value]);$('#goal-preview').innerHTML=goals.slice(0,2).map(g=>`<div class="goal-mini"><div class="row between"><span>${g.short}</span><strong class="num money">${money(g.amount)} ₴</strong></div><div class="progress" role="progressbar" aria-label="${g.name}" aria-valuenow="${g.amount}" aria-valuemin="0" aria-valuemax="${g.target}"><span style="width:${Math.min(100,g.amount/g.target*100)}%"></span></div><small>Мета: <span class="money">${money(g.target)} ₴</span></small></div>`).join('');$('#goals').innerHTML=goals.map((g,i)=>`<article class="panel goal-card"><div class="goal-illustration">${icon(g.icon)}</div><h2>${g.name}</h2><p>${g.note}</p><div class="goal-number num money">${money(g.amount)} ₴</div><p>із <span class="money">${money(g.target)} ₴</span></p><div class="progress" role="progressbar" aria-label="${g.name}" aria-valuenow="${g.amount}" aria-valuemin="0" aria-valuemax="${g.target}"><span style="width:${Math.min(100,g.amount/g.target*100)}%"></span></div><small class="muted money">${Math.round(g.amount/g.target*100)}% від мети</small><button class="secondary" data-action="contribute" data-goal="${i}">Додати внесок</button></article>`).join('');$('#contribution-amount').max=Math.max(0,ownFunds);$('#saving-range').max=Math.max(0,15000-available());$('#credit-range-max').textContent=money(Math.max(0,15000-available()))+' ₴';renderPlan();renderCategories();$$('[data-action="contribute"]').forEach(b=>b.disabled=ownFunds<1)}
function openDialog(id,trigger){lastFocus=trigger;const dialog=$('#'+id);dialog.showModal();if(id==='contribution'){$('#goal-select').value=trigger.dataset.goal||'0';$('#contribution-amount').value=Math.min(1000,ownFunds);$('#contribution-amount').focus();$('#contribution-amount').select()}}
for(const nav of $$('nav'))nav.innerHTML=routes.map(([id,label,glyph])=>`<button type="button" data-page="${id}" ${id==='overview'?'aria-current="page"':''}>${icon(glyph)}<span>${label}</span></button>`).join('');
appRoot.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.themeChoice)setTheme(b.dataset.themeChoice);if(b.dataset.page)navigate(b.dataset.page);if(b.hasAttribute('data-close'))b.closest('dialog').close();if(b.dataset.action==='credit')openDialog('credit-option',b);if(b.dataset.action==='explain')openDialog('explanation',b);if(b.dataset.action==='contribute')openDialog('contribution',b);if(b.dataset.action==='privacy'){privateAmounts=!privateAmounts;host.classList.toggle('privacy',privateAmounts);$$('[data-action="privacy"]').forEach(el=>{el.setAttribute('aria-pressed',String(privateAmounts));el.setAttribute('aria-label',privateAmounts?'Показати суми':'Приховати суми')})}});
$$('dialog').forEach(d=>{d.addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();else {const replacement=$$('[data-action="contribute"]').find(b=>b.dataset.goal===lastFocus?.dataset.goal&&b.offsetParent!==null);replacement?.focus()}});d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}})});
$('#search').addEventListener('input',renderTransactions);
function renderPlan(){const n=Number($('#saving-range').value);$('#plan-saving').textContent=money(n)+' ₴';$('#plan-free').textContent=money(available()+n)+' ₴';$('#plan-debt').textContent=money(n)+' ₴'}
$('#saving-range').addEventListener('input',renderPlan);
$('#contribution-form').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('#contribution-amount').value);const goal=goals[Number($('#goal-select').value)];if(!Number.isInteger(amount)||amount<1||amount>ownFunds||!goal)return;goal.amount+=amount;ownFunds-=amount;renderMoney();$('#contribution').close();showToast('Внесок додано до ескізу. Реальні гроші не переміщено.')});
function renderCategories(){
 const food=Number($('#food-range').value),transport=Number($('#transport-range').value),other=100-food-transport;
 $('#food-weight').textContent=food+'%';$('#transport-weight').textContent=transport+'%';$('#other-weight').textContent=other+'%';
 const parts=[['Продукти',food,'var(--category-food)'],['Транспорт',transport,'var(--category-transport)'],['Інше',other,'var(--category-other)']];
 const dailyCents=93750;const amounts=[Math.round(dailyCents*food/100),Math.round(dailyCents*transport/100)];amounts.push(dailyCents-amounts[0]-amounts[1]);
 const exact=n=>new Intl.NumberFormat('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n/100);
 const legend=parts.map(([name,weight,color],i)=>`<span><i style="background:${color}"></i>${name} · ${weight}%<strong class="money">${exact(amounts[i])} ₴ / день</strong></span>`).join('');
 $('#category-legend').innerHTML=legend;$('#budget-category-summary').innerHTML=legend;
 $('#daily-strip').innerHTML=Array.from({length:16},(_,i)=>`<div class="day-column" aria-label="День ${i+1}: 937 гривень 50 копійок">${parts.map(([,weight,color])=>`<span style="height:${weight}%;background:${color}"></span>`).join('')}</div>`).join('');
 const zero=10+available()/15000*140;$('#zero-line').setAttribute('d',`M0 ${zero}H680`);$('.chart-wrap text').setAttribute('y',zero-6);
 $('.chart-wrap svg').setAttribute('aria-label',`Ілюстративний прогноз: витрати 937 гривень 50 копійок на день; без кредиту бракує ${15000-available()} гривень`);
}
$('#food-range').addEventListener('input',renderCategories);$('#transport-range').addEventListener('input',renderCategories);
$('#payments-list').innerHTML=$('.upcoming').innerHTML;
let theme='light';try{const stored=localStorage.getItem('cashflow-sketch-theme');if(stored==='dark'||stored==='light')theme=stored}catch{}
const requestedTheme=new URLSearchParams('').get('theme');if(requestedTheme==='light'||requestedTheme==='dark')theme=requestedTheme;
setTheme(theme);renderMoney();renderTransactions();navigate('overview');

}
for (const id of ['cf-desktop-preview','cf-phone-preview']) {
 const host = proposal.querySelector('#'+id);
 const appRoot = host.attachShadow({mode:'open'});
 appRoot.append(template.content.cloneNode(true));
 initialize(appRoot,host);
 if(globalThis.Tweak){const state={radius:22}; const tweak=new Tweak({container:host,onChange:()=>host.style.setProperty('--radius',state.radius+'px')}); tweak.addSlider(state,'radius',{label:'Заокруглення карток',min:12,max:28,unit:'px'});}
}
})();
</script>
